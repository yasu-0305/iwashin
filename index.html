<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071827">
  <meta name="description" content="イワシんと一緒に写真を撮れるARカメラ">
  <title>イワシん AR CAMERA</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <p class="brand">中村海産</p>
      <h1>イワシん <span>AR CAMERA</span></h1>
    </header>

    <section class="camera" aria-label="ARカメラ">
      <video id="video" autoplay muted playsinline></video>
      <div id="placeholder">
        <div class="fish-mini">◀<i></i></div>
        <p>「カメラをはじめる」を押して<br>カメラの使用を許可してください</p>
      </div>
      <div id="sticker" class="sticker" role="img" aria-label="イワシん">
        <div class="fish">
          <span class="tail"></span>
          <span class="body"><b class="eye"></b><b class="smile"></b><b class="shine"></b></span>
          <span class="fin"></span>
        </div>
        <strong>イワシん！</strong>
      </div>
      <div class="frame"></div>
      <div class="privacy">画像はサーバーへ送信されません</div>
    </section>

    <p id="message" role="status">準備ができたらカメラを起動してください</p>

    <nav class="controls" aria-label="カメラ操作">
      <button id="start" class="primary">カメラをはじめる</button>
      <button id="flip" disabled>↻<small>切替</small></button>
      <button id="capture" class="shutter" disabled aria-label="撮影"><span></span></button>
    </nav>
  </main>

  <dialog id="result">
    <div class="result-card">
      <button id="close" class="close" aria-label="閉じる">×</button>
      <h2>撮れました！</h2>
      <img id="photo" alt="撮影した写真">
      <div class="result-actions">
        <button id="share" class="primary">写真を共有</button>
        <a id="download" download="iwashin-ar-photo.jpg">端末に保存</a>
      </div>
      <p>もう一度撮るときは閉じてください</p>
    </div>
  </dialog>

  <canvas id="canvas" hidden></canvas>
  <script src="app.js"></script>
</body>
</html>
