<style>
:root{--navy:#0b2d52;--blue:#0877c9;--teal:#1c9b78;--orange:#e98a23;--red:#d94b45;--ink:#142b47;--muted:#6d7d90;--line:#dfe8f0;--soft:#f5f8fb;--shadow:0 14px 34px rgba(13,45,82,.08)}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#f6f9fc;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif}button,input,select{font:inherit}header{height:66px;background:#fff;border-bottom:1px solid #edf2f6;display:flex;align-items:center;justify-content:space-between;padding:0 max(18px,calc((100vw - 1180px)/2));position:sticky;top:0;z-index:20}.brand{display:flex;align-items:center;gap:10px}.wave{font-size:26px;color:var(--blue)}.brand strong{font-family:Georgia,serif;font-size:26px;letter-spacing:4px}.brand small{display:block;font-size:10px;letter-spacing:.08em;color:#6c7a89}.header-note{font-size:12px;color:#607186}.hero{background:linear-gradient(135deg,#123c67 0%,#1e5f8d 58%,#8bb2c2 100%);color:#fff}.hero-inner{max-width:1180px;margin:auto;padding:38px 24px 34px;display:grid;grid-template-columns:1fr 360px;gap:30px;align-items:center}.hero h1{margin:0 0 10px;font-family:Georgia,"Yu Mincho",serif;font-size:45px;font-weight:500;letter-spacing:.06em}.hero p{margin:0;line-height:1.8;font-size:16px;opacity:.94}.hero-card{background:rgba(255,255,255,.94);color:var(--ink);border-radius:14px;padding:20px 22px;box-shadow:0 14px 34px rgba(0,0,0,.12)}.hero-card b{font-size:18px}.hero-card p{color:#597086;font-size:13px;margin-top:7px}.hero-bullets{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.hero-bullets span{font-size:12px;color:#314d68}.hero-bullets span:before{content:'✓';display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:#25a574;color:#fff;margin-right:6px}.wrap{max-width:1180px;margin:0 auto;padding:22px 24px 50px;display:grid;grid-template-columns:220px 1fr;gap:22px}.steps{background:#eef4f8;border-radius:14px;padding:18px 14px;position:sticky;top:88px;height:max-content}.steps h3{font-size:14px;margin:0 0 12px}.step{display:flex;gap:10px;align-items:flex-start;padding:10px 0;color:#8a97a4}.dot{width:30px;height:30px;border-radius:50%;background:#aab7c4;color:#fff;display:grid;place-items:center;font-weight:700;flex:0 0 auto}.step.active{color:var(--ink);font-weight:700}.step.active .dot{background:var(--blue)}.step.done .dot{background:var(--teal)}.step small{display:block;font-size:10px;font-weight:400;color:#8b98a5;margin-top:2px}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:28px 30px;box-shadow:var(--shadow);min-height:580px}.progress{height:6px;background:#eef3f7;border-radius:99px;overflow:hidden;margin-bottom:20px}.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--blue),#56a9e8);transition:.25s}.eyebrow{font-size:12px;color:var(--blue);font-weight:700}.panel h2{margin:8px 0 8px;font-size:30px}.lead{margin:0 0 20px;color:var(--muted);line-height:1.7}.field{margin:18px 0}.field label{display:block;font-weight:700;margin-bottom:8px}.urlbox{width:100%;border:1px solid #cfdbe6;border-radius:10px;padding:14px 15px;color:var(--ink);background:#fff}.helper{font-size:12px;color:#8593a2;margin-top:6px}.question{padding:20px 0;border-top:1px solid #edf2f6}.question:first-child{border-top:0}.qtitle{font-weight:700;line-height:1.55;margin-bottom:11px}.qid{display:inline-block;background:#eaf4fc;color:var(--blue);border-radius:6px;padding:5px 7px;margin-right:8px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.choice{appearance:none;border:1px solid #d8e2eb;border-radius:9px;background:#fff;color:var(--ink);padding:12px 13px;cursor:pointer;text-align:left;display:flex;align-items:center;gap:9px;min-height:48px}.choice.selected{border:2px solid var(--blue);padding:11px 12px;background:#f5fbff}.radio{width:18px;height:18px;border:2px solid #c4d0dc;border-radius:50%;position:relative;flex:0 0 auto}.choice.selected .radio{border-color:var(--blue)}.choice.selected .radio:after{content:'';position:absolute;inset:3px;border-radius:50%;background:var(--blue)}.actions{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:24px}.btn{border:0;border-radius:10px;padding:14px 22px;font-weight:700;cursor:pointer;min-height:50px}.secondary{background:#eef3f7;color:#4e6478}.primary{background:linear-gradient(90deg,#0b6fb8,#2e8fdd);color:#fff;min-width:210px}.validation{display:none;margin-top:14px;padding:12px 14px;background:#fff2f2;border:1px solid #f0c7c7;color:#a43e3e;border-radius:9px;font-size:13px;font-weight:700}.note{font-size:11px;color:#8a97a4;margin-top:14px}.result{display:none}.result-hero{display:grid;grid-template-columns:180px 1fr;gap:24px;align-items:center;padding:4px 0 24px}.gauge{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--blue) calc(var(--score)*1%),#e6eef5 0);position:relative;margin:auto}.gauge:after{content:'';position:absolute;width:112px;height:112px;border-radius:50%;background:#fff}.gauge-text{position:relative;z-index:1;text-align:center}.gauge-text strong{display:block;font-size:42px}.gauge-text span{font-size:12px;color:#718194}.result-hero h2{font-size:31px;margin:0 0 8px}.company-line{font-size:13px;color:#687a8d;margin-bottom:12px}.result-sub{color:#637589;line-height:1.7}.result-section{margin-top:26px}.section-title{font-size:20px;margin:0 0 13px}.loss-banner{display:grid;grid-template-columns:1.2fr .8fr;gap:14px;background:#fff3f2;border:1px solid #f2d1cd;border-radius:14px;padding:18px}.loss-big strong{display:block;font-size:42px;color:#c63f39;margin-top:4px}.loss-big span{font-size:12px;color:#7b5f5f}.loss-meta{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mini{background:#fff;border-radius:10px;padding:13px}.mini b{display:block;font-size:20px}.mini span{font-size:11px;color:#7c8791}.axis-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.axis-card{border-radius:14px;padding:18px;border:1px solid var(--line);background:#fff}.axis-card.plan{background:#f2f8fd;border-color:#d8e9f7}.axis-card.finance{background:#eef9f5;border-color:#d4eee5}.axis-card.product{background:#fff7ef;border-color:#f4dfc7}.axis-head{display:flex;justify-content:space-between;gap:8px;align-items:center}.axis-head b{font-size:16px}.axis-score{font-size:24px;font-weight:800}.bar{height:8px;background:rgba(107,125,143,.15);border-radius:99px;overflow:hidden;margin:10px 0}.bar span{display:block;height:100%;border-radius:99px}.plan .bar span{background:var(--blue)}.finance .bar span{background:var(--teal)}.product .bar span{background:var(--orange)}.loss-label{font-size:11px;color:#77889a}.loss-amt{font-size:27px;font-weight:800;color:#c6403d;margin:3px 0 10px}.metric-list{display:grid;gap:7px;font-size:12px;color:#52667b}.metric-list div{display:flex;justify-content:space-between;gap:10px}.metric-list strong{color:var(--ink)}.compare{display:grid;grid-template-columns:1fr 80px 1fr;align-items:center;gap:14px;margin:14px 0}.compare-box{border-radius:14px;padding:18px;background:#f5f8fb}.compare-box.after{background:#edf8f4}.compare-box small{color:#758698}.compare-box strong{display:block;font-size:34px;margin:5px 0}.arrow{font-size:32px;text-align:center;color:var(--blue)}.impact-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.impact{border:1px solid var(--line);border-radius:14px;padding:17px}.impact h4{margin:0 0 7px}.impact strong{font-size:25px}.impact.plan strong{color:var(--blue)}.impact.finance strong{color:var(--teal)}.impact.product strong{color:var(--orange)}.impact ul{padding-left:18px;margin:10px 0 0;color:#5f7184;font-size:12px;line-height:1.65}.personal{border-left:5px solid var(--blue);background:#f7fbfe;border-radius:12px;padding:18px 20px;line-height:1.75}.personal b{display:block;margin-bottom:6px}.assumption{background:#fffaf2;border:1px solid #f0e2c7;border-radius:10px;padding:12px 14px;font-size:11px;color:#7a6a50;margin-top:12px}.fineprint{font-size:11px;color:#8793a0;line-height:1.65;margin-top:16px}@media(max-width:820px){header{height:58px;padding:0 16px}.brand strong{font-size:22px}.header-note{display:none}.hero-inner{grid-template-columns:1fr;padding:26px 18px}.hero h1{font-size:34px}.hero-card{display:none}.wrap{display:block;padding:14px}.steps{position:static;display:flex;overflow:auto;gap:8px;padding:10px;margin-bottom:12px}.steps h3{display:none}.step{min-width:82px;display:block;text-align:center;font-size:10px}.dot{margin:auto}.step small{display:none}.panel{padding:20px 16px;min-height:auto}.panel h2{font-size:25px}.choices{grid-template-columns:1fr}.actions{position:static;background:#fff;padding-top:6px}.primary{flex:1}.result-hero{grid-template-columns:1fr}.result-hero h2,.company-line,.result-sub{text-align:center}.loss-banner,.axis-grid,.impact-grid{grid-template-columns:1fr}.compare{grid-template-columns:1fr}.arrow{transform:rotate(90deg)}.loss-meta{grid-template-columns:1fr 1fr}.gauge{width:136px;height:136px}.gauge:after{width:100px;height:100px}}
</style>

<body>
<header><div class="brand"><span class="wave">≋</span><div><strong>HAIFF</strong><small>現場の知恵を、未来の力に。</small></div></div><div class="header-note">無料診断 デモ版｜約5分</div></header>
<section class="hero"><div class="hero-inner"><div><h1>社長を、経営者に戻す。</h1><p>生産計画・数値見える化（日次決算）・商品開発。<br>3つの視点から、今の負荷とHAIFF導入後の改善ポテンシャルを試算します。</p></div><div class="hero-card"><b>診断は3軸でシンプルに</b><p>公開サイトURLと回答内容をもとに、結果コメントを御社向けに簡易カスタマイズします。</p><div class="hero-bullets"><span>生産計画</span><span>数値見える化</span><span>商品開発</span><span>ROI・時間差分</span></div></div></div></section>
<div class="wrap"><aside class="steps" id="steps"></aside><main class="panel"><div id="quiz"><div class="progress"><span id="bar"></span></div><div class="eyebrow" id="eyebrow"></div><h2 id="title"></h2><p class="lead" id="lead"></p><div id="introFields"></div><div id="questions"></div><div id="validation" class="validation">このページの必須項目に回答してください。</div><div class="actions"><button class="btn secondary" type="button" id="back">戻る</button><button class="btn primary" type="button" id="next">次へ進む</button></div><div class="note">※ デモ版の算定式・改善率は仮説です。実証データ蓄積後に校正します。</div></div><div class="result" id="result"></div></main></div>
<script>
(function(){
var state={step:0,answers:{},url:'',employees:'10〜30名',sector:'水産加工',hourly:5000};var steps=['会社情報','生産計画','数値見える化','商品開発','診断結果'];
var data=[{title:'会社情報',lead:'最初に会社の公開URLと規模を教えてください。診断結果のコメントを御社向けに調整するために使います。',intro:true,qs:[]},{title:'生産計画',lead:'毎日の計画作成・変更・確認に、どれだけ時間と判断が使われているかを見ます。',qs:[['P1','社長または責任者が、生産計画の作成・調整に使う時間は1日平均？',['0〜10分','11〜20分','21〜30分','31〜60分','60分超'],[5,15,25,45,75]],['P2','受注・欠勤・原料不足などで計画を組み直す頻度は？',['ほぼない','月数回','週1〜2回','ほぼ毎日','1日に何度も'],[0,1,2,3,4]],['P3','生産計画を一人で組める人は何人いますか？',['4人以上','3人','2人','社長＋1人','社長・特定の1人だけ'],[0,1,2,3,4]],['P4','計画のために、在庫・人員・設備能力を別々に確認する必要がありますか？',['ほぼ不要','少しある','時々ある','よくある','毎回ある'],[0,1,2,3,4]],['P5','HAIFF導入初期に、商品・原料・設備・人員ルールを整理する時間を取れますか？',['必ず取る','取れる','支援があれば','難しい','取れない'],[4,3,2,1,0]]]},{title:'数値見える化（日次決算）',lead:'「作った後に分かる」から「今日の数字を今日見る」へ。集計負荷と判断の遅れを見ます。',qs:[['F1','売上・原価・粗利・在庫などの数字を、経営判断に使える状態にするまでどれくらいかかりますか？',['ほぼリアルタイム','当日中','翌日〜数日','週次','月次以降'],[0,1,2,3,4]],['F2','Excel・紙・システムなどから数字を集め直す時間は月合計で？',['0〜1時間','2〜4時間','5〜9時間','10〜19時間','20時間以上'],[0.5,3,7,14,24]],['F3','「数字が分からず判断を待つ」ことはどれくらいありますか？',['ほぼない','月1回程度','月数回','週数回','ほぼ毎日'],[0,1,2,3,4]],['F4','商品別・得意先別などで「どこが儲かっているか」をすぐ確認できますか？',['すぐ分かる','ほぼ分かる','調べれば分かる','かなり手間','把握できていない'],[0,1,2,3,4]],['F5','数字を見た結果、現場のやり方を変える判断を続けられますか？',['継続している','できる','支援があれば','やや難しい','難しい'],[4,3,2,1,0]]]},{title:'商品開発',lead:'アイデア・市場調査・原価試算・社内調整に使う時間と、新商品を出すまでの負荷を見ます。',qs:[['D1','新商品の情報収集・アイデア出し・市場調査に使う時間は月合計で？',['0〜2時間','3〜5時間','6〜10時間','11〜20時間','21時間以上'],[1,4,8,15,24]],['D2','新商品1案の原価・工程・価格・ターゲット整理にかかる時間は？',['1時間未満','1〜3時間','半日程度','1日程度','2日以上'],[0.5,2,4,8,16]],['D3','「考えたいが、日々の現場対応で後回しになる」ことは？',['ほぼない','たまに','月数回','毎週','ほぼ常に'],[0,1,2,3,4]],['D4','新商品アイデアを社員と共有し、検討を前へ進められる状態ですか？',['仕組み化済み','概ねできる','人による','社長中心','ほぼ社長だけ'],[0,1,2,3,4]],['D5','新しい仕組みが一度うまくいかなくても、原因を見て改善を続けられますか？',['必ず再挑戦','改善して続ける','支援があれば','様子を見る','元に戻す'],[4,3,2,1,0]]]},{title:'診断結果',lead:'',qs:[]}];
function el(id){return document.getElementById(id)}function scrollTopPanel(){try{window.scrollTo(0,document.querySelector('.wrap').offsetTop-60)}catch(e){}}function escapeHtml(s){return String(s||'').replace(/[&<>"]/g,function(ch){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]})}
function renderSteps(){var h='<h3>全5ステップ</h3>';for(var i=0;i<steps.length;i++){var c='step';if(i===state.step)c+=' active';if(i<state.step)c+=' done';h+='<div class="'+c+'"><div class="dot">'+(i<state.step?'✓':i+1)+'</div><div>'+steps[i]+'<small>'+(i===4?'結果':i===0?'入力':data[i].qs.length+'問')+'</small></div></div>'}el('steps').innerHTML=h}
function renderIntro(){el('introFields').innerHTML='<div class="field"><label>会社URL <span style="color:#d54c48">*</span></label><input id="companyUrl" class="urlbox" type="url" inputmode="url" placeholder="https://example.co.jp" value="'+escapeHtml(state.url)+'"><div class="helper">デモ版では、URLのドメイン名と回答内容を結果コメントに利用します。本番では公開サイト情報の解析連携を想定します。</div></div><div class="field"><label>主な業種</label><select id="sector" class="urlbox"><option>水産加工</option><option>食品製造</option><option>惣菜・中食</option><option>菓子・パン製造</option><option>その他製造</option></select></div><div class="field"><label>従業員数（パート含む）</label><select id="employees" class="urlbox"><option>1〜4名</option><option>5〜9名</option><option selected>10〜30名</option><option>31〜50名</option><option>51名以上</option></select></div><div class="field"><label>経営者の時間価値（仮入力・円/時）</label><input id="hourly" class="urlbox" type="number" min="1000" step="500" value="'+state.hourly+'"><div class="helper">時間損失を金額換算するための仮置きです。後で変更できます。</div></div>';el('sector').value=state.sector;el('employees').value=state.employees;el('companyUrl').addEventListener('input',function(){state.url=this.value});el('sector').addEventListener('change',function(){state.sector=this.value});el('employees').addEventListener('change',function(){state.employees=this.value});el('hourly').addEventListener('input',function(){state.hourly=parseInt(this.value,10)||5000})}
function render(){renderSteps();var s=data[state.step];el('bar').style.width=(state.step/4*100)+'%';el('eyebrow').textContent='ステップ '+(state.step+1)+' / 5';el('title').textContent=s.title;el('lead').textContent=s.lead;el('validation').style.display='none';el('introFields').innerHTML='';if(s.intro)renderIntro();var h='';for(var qn=0;qn<s.qs.length;qn++){var q=s.qs[qn];h+='<div class="question"><div class="qtitle"><span class="qid">'+q[0]+'</span>'+q[1]+'</div><div class="choices">';for(var i=0;i<q[2].length;i++){var sel=state.answers[q[0]]&&state.answers[q[0]].i===i;h+='<button type="button" class="choice'+(sel?' selected':'')+'" data-q="'+q[0]+'" data-i="'+i+'"><span class="radio"></span><span>'+q[2][i]+'</span></button>'}h+='</div></div>'}el('questions').innerHTML=h;el('back').style.visibility=state.step===0?'hidden':'visible';el('next').textContent=state.step===3?'診断結果を見る':'次へ進む'}
el('questions').addEventListener('click',function(ev){var n=ev.target;while(n&&n!==this&&!n.getAttribute('data-q'))n=n.parentNode;if(!n||n===this)return;var qid=n.getAttribute('data-q'),idx=parseInt(n.getAttribute('data-i'),10),qs=data[state.step].qs,q=null;for(var j=0;j<qs.length;j++)if(qs[j][0]===qid)q=qs[j];if(!q)return;state.answers[qid]={i:idx,val:q[3][idx],label:q[2][idx]};render()});function complete(){if(state.step===0){var u=(el('companyUrl')?el('companyUrl').value:state.url).trim();state.url=u;if(!u)return false;try{var x=new URL(u.indexOf('http')===0?u:'https://'+u);state.url=x.href}catch(e){return false}return true}var qs=data[state.step].qs;for(var i=0;i<qs.length;i++)if(!state.answers[qs[i][0]])return false;return true}
el('next').addEventListener('click',function(){if(!complete()){el('validation').style.display='block';return}if(state.step<3){state.step++;render();scrollTopPanel()}else showResult()});el('back').addEventListener('click',function(){if(state.step>0){state.step--;render();scrollTopPanel()}});
function norm(vals,max){var s=0;for(var i=0;i<vals.length;i++)s+=vals[i];return Math.max(0,Math.min(100,Math.round(s/max*100)))}function money(n){return Math.round(n).toLocaleString('ja-JP')}function domainName(){try{return new URL(state.url).hostname.replace(/^www\./,'')}catch(e){return '御社'}}function get(q,def){return state.answers[q]?state.answers[q].val:def}
function sectionLoss(total,hours){return '<div class="result-section"><h3 class="section-title">現在発生している「見えている時間コスト」</h3><div class="loss-banner"><div class="loss-big"><span>回答から定量化できた年間コスト</span><strong>約 '+money(total/10000)+'万円</strong><span>※ 経営者・担当者の時間価値 × 回答時間。機会損失は含みません。</span></div><div class="loss-meta"><div class="mini"><span>年間時間</span><b>'+Math.round(hours)+'h</b></div><div class="mini"><span>8時間換算</span><b>'+Math.round(hours/8)+'日</b></div></div></div></div>'}
function axisCard(cls,name,score,loss,hours,m1,v1,m2,v2){return '<div class="axis-card '+cls+'"><div class="axis-head"><b>'+name+'</b><span class="axis-score">'+score+'</span></div><div class="bar"><span style="width:'+score+'%"></span></div><div class="loss-label">現在の年間時間コスト（試算）</div><div class="loss-amt">約 '+money(loss/10000)+'万円</div><div class="metric-list"><div><span>'+m1+'</span><strong>'+v1+'</strong></div><div><span>'+m2+'</span><strong>'+v2+'</strong></div></div></div>'}
function impact(cls,name,m,h,items){var li='';for(var i=0;i<items.length;i++)li+='<li>'+items[i]+'</li>';return '<div class="impact '+cls+'"><h4>'+name+'</h4><strong>約 '+money(m/10000)+'万円/年</strong><div class="helper">約 '+h+'時間/年の改善余地</div><ul>'+li+'</ul></div>'}
function personalActivities(){var best='plan',scores={plan:get('P2',0)+get('P3',0)+get('P4',0),finance:get('F3',0)+get('F4',0),product:get('D3',0)+get('D4',0)};if(scores.finance>scores[best])best='finance';if(scores.product>scores[best])best='product';var text='';if(best==='plan')text='生産調整に使っていた時間を、<strong>取引先との商談、設備・人員配置の改善、採用・育成、現場責任者への権限移譲</strong>に振り向ける余地があります。';if(best==='finance')text='集計や数字確認の時間を、<strong>粗利の改善、価格改定の判断、得意先別・商品別の採算確認、将来投資の検討</strong>に振り向ける余地があります。';if(best==='product')text='商品調査や整理に使う時間を、<strong>試作、顧客ヒアリング、展示会・販路開拓、パッケージ・価格検討、新商品の意思決定</strong>へ寄せる余地があります。';if(state.sector==='水産加工')text+=' 水産加工ではさらに、<strong>原料相場・歩留まり・季節性・販売先別の動き</strong>を見ながら、次の商品や仕入判断に経営者の時間を使うイメージです。';else text+=' 御社の業種特性に合わせ、将来は公開サイト情報から具体的な商品・販路・採用テーマまでコメントを個別化する想定です。';return text}
function showResult(){state.step=4;renderSteps();el('quiz').style.display='none';var dailyPlan=get('P1',25),planFreq=get('P2',2),planPeople=get('P3',2),planLookup=get('P4',2),planReady=get('P5',2),financeH=get('F2',7),financeDelay=get('F3',2),financeProfit=get('F4',2),financeReady=get('F5',2),devResearch=get('D1',8),devOne=get('D2',4),devDelay=get('D3',2),devShare=get('D4',2),devReady=get('D5',2);var planScore=norm([Math.min(dailyPlan/20,4),planFreq,planPeople,planLookup,4-planReady],20),financeScore=norm([get('F1',2),Math.min(financeH/6,4),financeDelay,financeProfit,4-financeReady],20),productScore=norm([Math.min(devResearch/6,4),Math.min(devOne/4,4),devDelay,devShare,4-devReady],20),total=Math.round((planScore+financeScore+productScore)/3);var annualPlanH=dailyPlan*250/60,annualFinanceH=financeH*12,annualDevH=(devResearch*12)+(devOne*6),planLoss=annualPlanH*state.hourly,financeLoss=annualFinanceH*state.hourly,devLoss=annualDevH*state.hourly,totalLoss=planLoss+financeLoss+devLoss;var planRate=.50,financeRate=.60,devRate=.35,savePlan=planLoss*planRate,saveFinance=financeLoss*financeRate,saveDev=devLoss*devRate,annualSave=savePlan+saveFinance+saveDev,afterCost=Math.max(0,totalLoss-annualSave),savedHours=(annualPlanH*planRate)+(annualFinanceH*financeRate)+(annualDevH*devRate),site=domainName(),activities=personalActivities();var r=el('result');r.style.display='block';r.innerHTML='<div class="eyebrow">HAIFF 無料診断｜デモ版</div><div class="result-hero"><div class="gauge" style="--score:'+total+'"><div class="gauge-text"><strong>'+total+'</strong><span>/100 改善ポテンシャル</span></div></div><div><h2>3つの領域に、改善の余地が見えています</h2><div class="company-line">対象サイト：'+escapeHtml(site)+' ｜ '+escapeHtml(state.sector)+' ｜ '+escapeHtml(state.employees)+'</div><div class="result-sub">現在の回答から、定量化できる「時間コスト」を中心に試算しました。売上機会損失や在庫・廃棄損失は根拠が不足するため、このデモでは原則として金額に含めていません。</div></div></div>'+sectionLoss(totalLoss,annualPlanH+annualFinanceH+annualDevH)+'<div class="result-section"><h3 class="section-title">3つの領域別 診断結果</h3><div class="axis-grid">'+axisCard('plan','生産計画',planScore,planLoss,annualPlanH,'計画・調整時間','年間 '+Math.round(annualPlanH)+'時間','変更・確認負荷','回答ベース')+axisCard('finance','数値見える化（日次決算）',financeScore,financeLoss,annualFinanceH,'集計・確認時間','年間 '+Math.round(annualFinanceH)+'時間','判断の遅れ','別途ポテンシャル')+axisCard('product','商品開発',productScore,devLoss,annualDevH,'調査・検討時間','年間 '+Math.round(annualDevH)+'時間','後回しリスク','別途ポテンシャル')+'</div></div><div class="result-section"><h3 class="section-title">HAIFF導入後の差分（試算）</h3><div class="compare"><div class="compare-box"><small>現在の定量化できる時間コスト</small><strong>約 '+money(totalLoss/10000)+'万円/年</strong><span>約 '+Math.round(annualPlanH+annualFinanceH+annualDevH)+'時間/年</span></div><div class="arrow">→</div><div class="compare-box after"><small>HAIFF導入後の試算</small><strong>約 '+money(afterCost/10000)+'万円/年</strong><span>約 '+Math.round(savedHours)+'時間/年を取り戻す余地</span></div></div><div class="impact-grid">'+impact('plan','生産計画',savePlan,Math.round(annualPlanH*planRate),['計画作成・組み直し時間の圧縮','原料・人員・設備条件の同時確認','社長への確認回数を減らす土台'])+impact('finance','数値見える化',saveFinance,Math.round(annualFinanceH*financeRate),['日次の数字確認を早める','集計・転記作業を削減','経営判断を翌週・翌月へ持ち越さない'])+impact('product','商品開発',saveDev,Math.round(annualDevH*devRate),['市場・競合情報整理の補助','原価・工程・価格検討の初動短縮','新商品案を社員と共有しやすくする'])+'</div><div class="assumption">試算前提：生産計画50%、数値見える化60%、商品開発35%の時間削減を仮置きしています。これはHAIFFの効果を保証する数値ではありません。実証データに応じて今後校正します。</div></div><div class="result-section"><h3 class="section-title">御社の場合、取り戻した時間をこう使えます</h3><div class="personal"><b>'+escapeHtml(site)+' 向けコメント（デモ）</b>'+activities+'</div><div class="fineprint">※ デモ版では入力された会社URLのドメイン・業種・回答内容からコメントを簡易生成しています。Webサイト本文を自動解析しているわけではありません。本番版では、公開情報を取得できる仕組みを別途実装することで、会社の事業・商品・採用・販路などに合わせたコメントへ高度化できます。</div></div><div class="result-section"><h3 class="section-title">次のステップ</h3><div class="personal"><b>診断の目的は「HAIFFを売ること」だけではありません。</b>生産計画・数字・商品開発のどこに負荷が集中しているかを把握し、経営者が本来使うべき時間へ戻すことが目的です。導入初期には、商品・原料・設備・人員・判断基準を整理する時間と、会社側の自覚・責任・覚悟・情熱も必要です。</div><div class="actions"><button class="btn secondary" type="button" id="restart">最初から試す</button><button class="btn primary" type="button" id="assume">前提を確認</button></div></div>';el('restart').addEventListener('click',function(){window.location.reload()});el('assume').addEventListener('click',function(){window.alert('デモ版の改善率：生産計画50%／数値見える化60%／商品開発35%。実際の効果を保証するものではありません。')});scrollTopPanel()}
